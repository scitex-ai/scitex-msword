[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-msword"
version = "0.3.2"
description = "MS Word (.docx) reader/writer with journal-style profiles (MDPI, IEEE, Springer, Elsevier, RESNA, IOP) — standalone module from the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "msword", "docx", "word", "manuscript", "journal-template"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "python-docx>=0.8.11",
    "click>=8.1",
    # Declared because package source logs via scitex-logging (PS-220):
    # hooks/_lookup.py binds a slogging logger at module import.
    "scitex-logging",
]

[project.optional-dependencies]
tex = [
    "scitex-tex",  # provides scitex_tex.export_tex for convert_docx_to_tex
]
# MCP server scaffold (priority 8 of the BOOST v16 dogfooding sprint).
# The Anthropic MCP Python SDK is only needed when running
# scitex_msword.mcp_server.serve(); the module imports successfully
# without it (raising a clear error only at server-startup time).
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "scitex-dev>=0.11.7",
    # PS-210 dev-extras-completeness: the [tex] extra's scitex-tex must also
    # resolve under [dev] so a fresh `pip install -e .[dev]` runs the full
    # suite (incl. the cross-package gate importing scitex_tex).
    "scitex-tex",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-msword[tex,mcp]",
]

[project.scripts]
scitex-msword = "scitex_msword.cli:main"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-msword"
Repository = "https://github.com/ywatanabe1989/scitex-msword"
Documentation = "https://scitex-msword.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_msword = ["_skills/**/*.md"]

[project.entry-points."scitex_dev.skills"]
scitex-msword = "scitex_msword"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-warnings"]
markers = [
    "smoke: fast subprocess CLI happy-path tests (<60s)",
    "e2e: slow end-to-end workflows against real subsystems (RUN_E2E=1 to run)",
]

[tool.coverage.run]
parallel = true
source = ["scitex_msword"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "apps", "config", "docs", "examples"]
